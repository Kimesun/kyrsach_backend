name: CI/CD для Онлайн-Дневника

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ========== JOB 1: ПРОВЕРКА BACKEND ==========
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей backend
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy psycopg2-binary python-jose[cryptography] passlib[bcrypt] python-multipart pydantic python-dotenv
      
      - name: Создание .env файла для CI
        run: |
          cd backend
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/diary_db
          SECRET_KEY=ci-test-secret-key-must-be-at-least-32-characters-long
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF
          cat .env
      
      - name: Проверка импортов backend
        run: |
          cd backend
          python -c "
          import os
          from dotenv import load_dotenv
          
          # Загружаем .env
          load_dotenv()
          
          # Проверяем переменные
          assert os.getenv('DATABASE_URL'), 'DATABASE_URL not set'
          assert os.getenv('SECRET_KEY'), 'SECRET_KEY not set'
          print('✅ Environment variables loaded')
          
          # Проверяем импорты
          from app.main import app
          print('✅ Main imported')
          
          from app import models, schemas, auth, database
          print('✅ Core modules imported')
          
          from app.routes import auth_router, entries_router
          print('✅ Routes imported')
          
          from app.config import Config
          print(f'✅ Config loaded: DATABASE_URL={Config.DATABASE_URL[:30]}...')
          
          print('SUCCESS: All checks passed!')
          "

  # ========== JOB 2: СБОРКА FRONTEND ==========
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Очистка кеша npm
        run: npm cache clean --force
      
      - name: Установка зависимостей (без кеширования)
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps --no-package-lock
      
      - name: Сборка frontend
        run: |
          cd frontend
          CI=false npm run build
      
      - name: Проверка сборки
        run: |
          if [ -d "frontend/build" ] && [ -f "frontend/build/index.html" ]; then
            echo "✅ Build successful"
            ls -la frontend/build/
          else
            echo "❌ Build failed - build directory not found"
            exit 1
          fi

  # ========== JOB 3: SMOKE TEST ==========
  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Создание .env для Docker
        run: |
          mkdir -p backend
          cat > backend/.env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@db:5432/diary_db
          SECRET_KEY=docker-smoke-test-secret-key-at-least-32-chars
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF
          cat backend/.env
      
      - name: Запуск Docker Compose
        run: docker-compose up -d --build
      
      - name: Ожидание запуска сервисов
        run: sleep 30
      
      - name: Просмотр логов Docker
        run: docker-compose logs --tail=50
      
      - name: Проверка backend health
        run: |
          curl -v http://localhost:8000/health || (docker-compose logs backend && exit 1)
      
      - name: Проверка frontend
        run: |
          curl -v http://localhost:3000 || exit 1
      
      - name: Тест регистрации пользователя
        run: |
          curl -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser","email":"ci@test.com","password":"cipass123"}' || exit 1
          echo "✅ Registration works"
      
      - name: Тест логина
        run: |
          curl -X POST http://localhost:8000/api/auth/login \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "username=ciuser&password=cipass123" || exit 1
          echo "✅ Login works"
      
      - name: Остановка Docker Compose
        run: docker-compose down