name: CI/CD для Онлайн-Дневника

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ПРОВЕРКА BACKEND
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей
        run: |
          cd backend
          pip install fastapi uvicorn sqlalchemy psycopg2-binary python-jose[cryptography] passlib[bcrypt] python-multipart pydantic python-dotenv
      
      - name: Создание .env
        run: |
          cd backend
          cat > .env << 'EOF'
          DATABASE_URL=sqlite:///./test.db
          SECRET_KEY=test-secret-key-at-least-32-chars-long
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EOF
      
      - name: Проверка импортов
        run: |
          cd backend
          python -c "
          from dotenv import load_dotenv
          load_dotenv()
          from app.main import app
          from app import models, schemas, auth, database
          from app.routes import auth_router, entries_router
          print('✅ All backend imports successful')
          "

  # СБОРКА FRONTEND (исправленная)
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Очистка кеша
        run: npm cache clean --force
      
      - name: Подготовка
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
      
      - name: Установка зависимостей
        run: |
          cd frontend
          npm install --legacy-peer-deps --no-package-lock
      
      - name: Фикс ajv
        run: |
          cd frontend
          npm install ajv@8 ajv-keywords@5 --save-dev --legacy-peer-deps --no-package-lock
      
      - name: Сборка
        run: |
          cd frontend
          export NODE_OPTIONS="--max-old-space-size=4096"
          CI=false npm run build
      
      - name: Проверка
        run: test -f frontend/build/index.html