name: Simple CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Test Backend Imports
        run: |
          cd backend
          pip install -r requirements.txt
          python -c "from app.main import app; print('Backend OK')"
      
      - name: Test Frontend Build
        run: |
          cd frontend
          npm install
          npm run build
          echo "Frontend OK"